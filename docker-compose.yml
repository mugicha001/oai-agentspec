# =============================================================================
# oai-agentspec ローカル SAST/SCA 構成（最小）
# =============================================================================
# 本ライブラリのセキュリティスキャンに必要な最小サービスのみを定義する。
# DAST / fuzzing / pentest / observability は含めない。
#
# 使い方（docker-compose.yml はルートに置くため -f 指定は不要）:
#   SonarQube 起動:   docker compose up -d
#                     -> http://localhost:9000 (初期 admin/admin)
#   SAST スキャン:    docker compose --profile scanner run --rm sonar-scanner
#   SCA スキャン:     make sca （docker compose --profile security run --rm trivy-fs）
# =============================================================================

services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: oai-agentspec-sonarqube
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sonar}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-sonar}
      # ローカル開発専用。本番では適切なカーネル設定を行い無効化しないこと。
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: oai-agentspec-sonarqube-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonar}
      POSTGRES_USER: ${POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonar}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # SAST: SonarScanner（sonar-project.properties に従う）
  sonar-scanner:
    # SonarQube 9.9 LTS と互換のスキャナ系列に固定（latest=8.x は 9.9 サーバと非互換）
    image: sonarsource/sonar-scanner-cli:5.0
    container_name: oai-agentspec-sonar-scanner
    working_dir: /usr/src
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: ${SONAR_HOST_URL:-http://sonarqube:9000}
      SONAR_TOKEN: ${SONAR_TOKEN}
    volumes:
      - ./:/usr/src
    profiles:
      - scanner

  # SCA: Trivy ファイルシステムスキャン（src + uv.lock の依存。HIGH/CRITICAL で fail）
  # Trivy は uv.lock をネイティブ対応するため requirements.txt の事前生成は不要。
  trivy-fs:
    image: aquasec/trivy:0.69.3
    container_name: oai-agentspec-trivy-fs
    profiles:
      - security
    volumes:
      - ./src:/scan/src:ro
      - ./uv.lock:/scan/uv.lock:ro
      - ./.security/reports:/output
      - trivy-cache:/root/.cache
    command: >
      fs --scanners vuln,secret,misconfig
      --severity HIGH,CRITICAL
      --exit-code 1
      -f json -o /output/trivy-fs-report.json
      /scan

  # シークレットスキャン: gitleaks（git 履歴 + 作業ツリー。検出で非ゼロ終了）
  # 実行方法: docker compose --profile secrets run --rm gitleaks
  gitleaks:
    image: zricethezav/gitleaks:latest
    container_name: oai-agentspec-gitleaks
    profiles:
      - secrets
    volumes:
      - ./:/repo:ro
    command: detect --source=/repo --redact --verbose

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
  trivy-cache:
