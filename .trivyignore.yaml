# Trivy の期限付き ignore（`make sca` のリリース前ゲートを機能させるための例外登録）
#
# 登録の条件: 上流依存の制約により当該リポジトリ側では解消できない検出のみを、期限と解除条件を
# 明記して登録する。自分たちで版を上げられるものは ignore せず依存を更新する。
# 期限（`expired_at`）を過ぎると Trivy は当該 ignore を無効化し検出が再浮上する。棚卸しの契機。
# フィールド名は snake_case の `expired_at` である（`expiredAt` は未知フィールドとして黙って
# 無視され、ignore が無期限に効いてしまう。追加・編集時は必ず過去日で再浮上を実測して確認する）。
#
# 検知経路の限界（重要）: 下記の解除条件の成立（上流の新版公開）を Dependabot の PR で知れるとは限らない。
# 上限を課している上流の agent-governance-toolkit は、`<5` の内側の新版（4.1.0）が公開されても
# Dependabot の更新 PR が出ていない。したがって解除の契機は本ファイルの `expired_at` による再浮上時の
# 手動確認とする（pull 型）。期限到来時は解除条件の成否を手で確認する。
#
# YAML 形式の ignore は Trivy 側で experimental 扱い（後方互換なく変わりうる）であり、`--ignorefile`
# での明示指定が必須。Trivy 更新時は本ファイルが依然有効かを `make sca` の挙動で確認する。
#
# 運用手順は `docs/security-scanning.md` を参照。

vulnerabilities:
  # cryptography を 49.0.0 以上へ上げれば解消するが、governance extra の依存鎖が上限を課している:
  #   agent-governance-toolkit[openai-agents] (最新 4.1.0)
  #     -> agent-governance-toolkit-integrations <5.0
  #        -> agent-governance-toolkit-core <5.0
  #           -> cryptography <49.0
  # integrations 5.0.0 / core 5.0.0 は公開済みだが、傘パッケージ agent-governance-toolkit の
  # 最新が 4.1.0 で `<5.0` を課すため到達できない。
  # 解除条件: agent-governance-toolkit が 5.x を公開し、core >=5.0 へ到達できるようになった時点。
  - id: CVE-2026-69249
    statement: >-
      cryptography>=49.0.0 が必要だが governance extra の依存鎖（agent-governance-toolkit 4.1.0
      -> integrations <5.0 -> core <5.0 -> cryptography <49.0）により到達不能。
      傘パッケージの 5.x 公開待ち。
    expired_at: 2026-11-06

  # こちらは cryptography 50.0.0 以上が必要で、core 5.0.0 でも `cryptography <50.0` のため
  # 上記の傘パッケージ更新だけでは解消しない。
  # 解除条件: agent-governance-toolkit-core が cryptography>=50.0 を許容する版を公開した時点。
  - id: CVE-2026-69247
    statement: >-
      cryptography>=50.0.0 が必要だが agent-governance-toolkit-core は最新 5.0.0 でも
      cryptography<50.0 を課すため到達不能。core 側の上限緩和待ち。
    expired_at: 2026-11-06

  # litellm を修正版（1.83.7 / 1.83.10 / 1.83.14 / 1.84.0 以降）へ上げれば解消するが、openai 3 と
  # 両立する litellm が 1.83.0 しか無い。openai-agents 0.22.x への追随（openai 3 必須）で、lock の
  # litellm は 1.92.1（下記 9 件を修正済み）から 1.83.0 へ下がった（退行）:
  #   oai-agentspec の core 依存 openai-agents 0.22.x -> openai >=3.0.0,<4
  #   oai-agentspec[lightning] -> agentlightning[apo] 0.3.0 -> litellm[proxy]（agentlightning の基本依存）
  #     litellm 1.83.0 は openai>=2.8.0（上限なし）、1.83.1〜1.83.7 は openai==2.30.0、
  #     1.83.8〜1.83.14 は openai==2.24.0、1.84.0 以降は openai<3.0.0 を要求する
  #     （`uv pip compile` で 1.83.1 以降が openai 3 と両立しないことを確認）。
  #   同じ経路の litellm-enterprise / fastapi-sso / soundfile / uvloop も版が下がったが、Trivy の
  #   HIGH / CRITICAL は無い。
  # 9 件とも litellm の proxy サーバが公開する HTTP エンドポイント・認証層の脆弱性である（Trivy DB の
  # 記述で確認）。lightning 機能の利用時は agentlightning 経由で litellm（proxy_server モジュールを
  # 含む）がプロセスに読み込まれるが、lib は LLMProxy を構成・起動しない（Trainer に llm_proxy を
  # 渡さない）。影響は利用者が agentlightning の LLM proxy（サーバ）を起動した場合に限られる。
  # 解除条件: litellm が openai 3 を許容し、かつ下記の修正を含む版を公開した時点。
  # 検知経路: litellm は推移依存で Dependabot の更新 PR が出た実績が無い（本 ignore 登録時点で
  # 0 件）。解除の契機は `expired_at` による再浮上時の手動確認とする。
  - id: CVE-2026-37004
    statement: >-
      litellm 1.83.7 以上が必要だが、openai 3 と両立する litellm は 1.83.0 のみ（lightning extra
      の proxy 経路）。openai 3 対応の修正版 litellm 待ち。
    expired_at: 2026-12-30
